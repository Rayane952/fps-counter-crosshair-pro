[workspace]
resolver = "2"
members = [
    "crates/ovl-core",
    "crates/ovl-overlay",
    "crates/ovl-ui",
    "crates/ovl-platform",
    "crates/ovl-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D", "Win32_Graphics_DirectWrite", "Win32_UI_WindowsAndMessaging", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tray-icon = "0.19"
global-hotkey = "0.6"
eframe = "0.29"
egui = "0.29"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
