[package]
name = "ovl-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "FPSOverlaySettings"
path = "src/main.rs"

[dependencies]
ovl-core = { path = "../ovl-core" }
ovl-platform = { path = "../ovl-platform" }
windows = { workspace = true }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
raw-window-handle = "0.6"
